<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szwagierowe Rozrywki - Szwagiery.pl</title>
    <meta name="description" content="Galeria zdjęć i filmów społeczności Szwagiery.pl.">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <meta name="theme-color" content="#120c08">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="back-link">&larr; Wróć do Centrum Dowodzenia</a>
        <h1>Szwagierowe Rozrywki</h1>
        <p class="subtitle">Galeria z folderów tematycznych</p>
        <div class="divider"></div>
    </header>

    <main id="galleries"></main>

    <div class="footer-note">
        Napędzane przez <a href="#">Szwagiery.pl</a> &copy; 2026
    </div>

    <script>
    // Dodaj kolejne sekcje tutaj - strona wygeneruje je automatycznie.
    // type: "image" lub "video"
    const GALLERIES = [
        {
            section: 'Rzym',
            items: [
                { title: 'Koloseum', type: 'image', src: 'media/rzym/koloseum.webp' },
                { title: 'Film z wyprawy', type: 'video', src: 'media/rzym/film_rzym.mp4' }
            ]
        }
    ];

    const container = document.getElementById('galleries');

    function renderMediaBox(item) {
        if (item.type === 'video') {
            return `<video controls preload="metadata">
                <source src="${item.src}" type="video/mp4">
                Twoja przeglądarka nie obsługuje elementu wideo.
            </video>`;
        }
        return `<img src="${item.src}" alt="${item.title}" loading="lazy"
                 onerror="this.closest('.media-box').innerHTML='<span style=\\'color:var(--text-muted);font-size:0.85rem;padding:10px;\\'>Plik niedostępny</span>'">`;
    }

    GALLERIES.forEach(gallery => {
        const sectionTitle = document.createElement('div');
        sectionTitle.className = 'section-title';
        sectionTitle.textContent = gallery.section;
        container.appendChild(sectionTitle);

        const grid = document.createElement('div');
        grid.className = 'grid media-grid';

        gallery.items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>${item.title}</h3>
                <div class="media-box">${renderMediaBox(item)}</div>
            `;
            grid.appendChild(card);
        });

        container.appendChild(grid);
    });

    if (GALLERIES.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">Brak materiałów do wyświetlenia.</p>';
    }
    </script>

</body>
</html>
