 <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szwagierowe Rozrywki - Szwagiery.pl</title>
    <meta name="description" content="Galeria zdjęć i filmów społeczności Szwagiery.pl.">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <meta name="theme-color" content="#120c08">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="logo.jpg" alt="Szwagiery.pl Logo">
            </a>
        </div>
        <a href="index.html" class="back-link">&larr; Wróć do Centrum Dowodzenia</a>
        <h1>Szwagierowe Rozrywki</h1>
        <p class="subtitle">Zdjęcia i filmy z folderu media oraz wyjazdów</p>
        <div class="divider"></div>
    </header>

    <!-- Sekcja: Zdjęcia z galerii -->
    <main id="galleries" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></main>

    <!-- Sekcja: Wyjazdy (Linki do folderów wideo) -->
    <div class="section-title">Wyjazdy</div>
    <div class="grid media-grid" id="videoFolders" style="padding-bottom: 50px;"></div>

    <div class="footer-note">
        Napędzane przez <a href="#">Szwagiery.pl</a> &copy; 2026
    </div>

    <script>
    // Konfiguracja galerii zdjęć (dodawaj kolejne foldery i zdjęcia według uznania)
    const GALLERIES = [
        {
            section: 'Rzym',
            items: [
                { title: 'Koloseum', type: 'image', src: 'media/rzym/koloseum.webp' }
            ]
        }
    ];

    const container = document.getElementById('galleries');

    function renderMediaBox(item) {
        return `<img src="${item.src}" alt="${item.title}" loading="lazy"
                 onerror="this.closest('.card').querySelector('.media-box').innerHTML='<span style=\\'color:var(--text-muted);font-size:0.85rem;padding:10px;\\'>Plik niedostępny</span>'">`;
    }

    GALLERIES.forEach(gallery => {
        const sectionTitle = document.createElement('div');
        sectionTitle.className = 'section-title';
        sectionTitle.textContent = gallery.section;
        container.appendChild(sectionTitle);

        const grid = document.createElement('div');
        grid.className = 'grid media-grid';

        gallery.items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <h3>${item.title}</h3>
                </div>
                <div class="media-box">
                    ${renderMediaBox(item)}
                </div>
            `;
            grid.appendChild(card);
        });

        container.appendChild(grid);
    });

    if (GALLERIES.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin: 20px;">Brak materiałów do wyświetlenia.</p>';
    }

    // Sekcja Wyjazdy - przyciski do zewnętrznych folderów z filmami
    const VIDEO_FOLDERS = [
        { title: 'Rzym', url: 'https://1drv.ms/f/c/d00a6770a66c6a51/IgBUSsFwsmMeQI2Xi3bd2LRjAYbO0YHw0WGIgdz8oN3pHPM' }
    ];

    const videoContainer = document.getElementById('videoFolders');
    VIDEO_FOLDERS.forEach(folder => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div>
                <h3>🎬 ${folder.title}</h3>
                <p>Otwórz folder z filmami z wyprawy do sekcji "${folder.title}".</p>
            </div>
            <a href="${folder.url}" target="_blank" rel="noopener noreferrer" class="btn">Otwórz folder</a>
        `;
        videoContainer.appendChild(card);
    });

    if (VIDEO_FOLDERS.length === 0) {
        videoContainer.innerHTML = '<p style="color:var(--text-muted);">Brak filmów do wyświetlenia.</p>';
    }
    </script>

</body>
</html>
